[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogentic-l13-factorization-certificates"
version = "1.0.0"
description = "Constructive Lean 4.35.0 & Zero-Float Exact Certificates for Unconditional L_N[1/3, 105] Las Vegas Integer Factorization (L13FACT-COGENTIC-CERT-1.0)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lluis Eriksson"}]
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
